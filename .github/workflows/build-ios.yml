name: Build iOS App

on:
  workflow_dispatch: # Chỉ chạy thủ công khi cần, không tự động build/up khi push tag

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Required for Capacitor 8)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16'

      - name: Setup Node.js (>=22 for Capacitor 8)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Patch Capacitor Plugins for Swift SPM
        run: |
          cp scripts/SharePlugin.swift node_modules/@capacitor/share/ios/Sources/SharePlugin/SharePlugin.swift
          rm -f node_modules/@capacitor/filesystem/ios/Sources/FilesystemPlugin/*.swift
          cp scripts/FilesystemPlugin.swift node_modules/@capacitor/filesystem/ios/Sources/FilesystemPlugin/FilesystemPlugin.swift
          ls -la node_modules/@capacitor/filesystem/ios/Sources/FilesystemPlugin/

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          cp scripts/SharePlugin.swift node_modules/@capacitor/share/ios/Sources/SharePlugin/SharePlugin.swift
          rm -f node_modules/@capacitor/filesystem/ios/Sources/FilesystemPlugin/*.swift
          cp scripts/FilesystemPlugin.swift node_modules/@capacitor/filesystem/ios/Sources/FilesystemPlugin/FilesystemPlugin.swift



      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          APP_DIR="build/App.xcarchive/Products/Applications"
          mkdir -p build/Payload
          cp -r "$APP_DIR"/*.app build/Payload/
          cd build
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.3"
          fi
          IPA_NAME="MathAILab-iOS-${TAG_NAME}.ipa"
          zip -r "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: build/${{ env.IPA_NAME }}
